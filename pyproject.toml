[tool.poetry]
name = "ha-motiondirection"
version = "1.3.0"
description = "Home Assistant custom integration for intelligent motion direction detection"
authors = ["tamaygz"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/tamaygz/ha-motiondirection"
repository = "https://github.com/tamaygz/ha-motiondirection"
documentation = "https://github.com/tamaygz/ha-motiondirection/wiki"
keywords = ["homeassistant", "motion", "detection", "automation", "smart-home"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]

[tool.poetry.dependencies]
python = "^3.12"
homeassistant = ">=2024.1.0"
voluptuous = "^0.14.0"
aiohttp = "^3.9.0"
rtree = "^1.2.0"

[tool.poetry.dev-dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
pytest-homeassistant-custom-component = "^0.13.0"
black = "^24.0.0"
pylint = "^3.0.0"
mypy = "^1.8.0"
pre-commit = "^3.6.0"
flake8 = "^7.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pylint.MASTER]
ignore = [
    "tests"
]
jobs = 2
persistent = "yes"
suggestion-mode = "yes"

[tool.pylint.MESSAGES CONTROL]
disable = [
    "format",
    "duplicate-code",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-instance-attributes",
    "too-many-locals",
]

[tool.pylint.REPORTS]
output-format = "colorized"
reports = "no"

[tool.pylint.FORMAT]
max-line-length = 100

[tool.pylint.BASIC]
good-names = ["_", "id", "x", "y", "dx", "dy", "i", "j", "k", "ex", "Run", "T", "v"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--cov=custom_components/motiondirection --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["custom_components/motiondirection"]
omit = [
    "custom_components/motiondirection/frontend/*",
    "tests/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
