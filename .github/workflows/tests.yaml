name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio pytest-homeassistant-custom-component
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f custom_components/motiondirection/manifest.json ]; then
            pip install aiohttp>=3.9.0
          fi

      - name: Lint with Black
        run: |
          pip install black
          black --check custom_components/ tests/

      - name: Lint with pylint
        run: |
          pip install pylint
          pylint custom_components/motiondirection

      - name: Type check with mypy
        run: |
          pip install mypy
          mypy custom_components/motiondirection --ignore-missing-imports
        continue-on-error: true

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --cov=custom_components/motiondirection --cov-report=xml --cov-report=term

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --cov=custom_components/motiondirection --cov-append --cov-report=xml --cov-report=term

      - name: Run performance tests
        run: |
          pytest tests/performance/ -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
