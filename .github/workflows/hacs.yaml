name: HACS Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 0 * * 0"  # Weekly on Sundays

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate for HACS
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
